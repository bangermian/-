<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高考顺 · Debug 增强版</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background: #1a1a2e; color: #ddd; font-family: "Microsoft Yahei", monospace; padding: 20px; }
        h1 { color: #ec0000; }
        .btn { background: #ec0000; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-secondary { background: #0f3460; margin-left: 10px; }
        .btn:hover { opacity: 0.85; }
        #log { background: #0a0a1a; padding: 16px; border-radius: 8px; max-height: 80vh; overflow-y: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.6; margin-top: 16px; border: 1px solid #0f3460; }
        .info { color: #3498db; }
        .ok { color: #00da3c; }
        .warn { color: #f39c12; }
        .err { color: #ff6b6b; }
        .file-header { color: #f1c40f; font-weight: bold; }
        .highlight { background: #2c3e50; padding: 0 4px; border-radius: 2px; }
        .summary { color: #1abc9c; font-weight: bold; font-size: 14px; }
        .debug-json { background: #0a0a1a; border: 1px solid #0f3460; border-radius: 4px; padding: 8px; margin-top: 8px; font-size: 12px; max-height: 200px; overflow: auto; }
        .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .input-group { display: flex; align-items: center; gap: 6px; color: #aaa; font-size: 13px; }
        .input-group input { width: 100px; padding: 4px 8px; background: #0f3460; border: 1px solid #0f3460; color: #fff; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🔍 高考顺 · Debug 增强版</h1>
    <p>此版本会详细打印每一步解析过程，并容错处理异常数据。</p>
    <div class="flex">
        <button class="btn" onclick="document.getElementById('folderInput').click()">📁 加载文件夹</button>
        <button class="btn btn-secondary" onclick="copyLog()">📋 复制日志</button>
        <button class="btn btn-secondary" onclick="clearLog()">🗑️ 清空日志</button>
        <div class="input-group">
            <label>默认考生数</label>
            <input type="number" id="defaultCandidates" value="70000">
        </div>
    </div>
    <input type="file" id="folderInput" webkitdirectory multiple accept=".xlsx,.xls" style="display:none">
    <div id="log">等待操作...</div>

    <script>
        const logEl = document.getElementById('log');
        let totalLog = '';

        function log(msg, type = '') {
            const timestamp = new Date().toLocaleTimeString();
            const cls = type ? ` class="${type}"` : '';
            const line = `<div${cls}>[${timestamp}] ${msg}</div>`;
            logEl.innerHTML += line;
            logEl.scrollTop = logEl.scrollHeight;
            totalLog += `[${timestamp}] ${msg}\n`;
        }

        function clearLog() {
            logEl.innerHTML = '';
            totalLog = '';
            log('日志已清空', 'info');
        }

        function copyLog() {
            navigator.clipboard.writeText(totalLog).then(() => {
                alert('日志已复制到剪贴板！');
            }).catch(() => {
                alert('复制失败，请手动选择文本复制。');
            });
        }

        document.getElementById('folderInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) {
                log('❌ 未选择任何文件', 'err');
                return;
            }
            clearLog();
            log(`📁 共选择 ${files.length} 个文件`, 'info');

            const excelFiles = [];
            for (let i = 0; i < files.length; i++) {
                if (files[i].name.match(/\.(xlsx|xls)$/i)) {
                    excelFiles.push(files[i]);
                }
            }
            if (excelFiles.length === 0) {
                log('❌ 未找到 .xlsx 或 .xls 文件', 'err');
                return;
            }
            log(`📊 找到 ${excelFiles.length} 个 Excel 文件`, 'info');

            // 收集所有解析结果
            const allData = { stock: {}, market: {}, plate: {} };
            let totalSchools = 0;
            let totalRecords = 0;
            let processed = 0;

            // 默认考生数
            const defaultCandidates = parseInt(document.getElementById('defaultCandidates').value) || 70000;
            let globalCandidates = defaultCandidates;

            excelFiles.forEach((file, idx) => {
                log(`\n--- 处理文件 ${idx+1}: ${file.name} ---`, 'file-header');

                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                        if (jsonData.length < 2) {
                            log(`  ⚠️ 数据行不足（少于2行），跳过`, 'warn');
                            processed++;
                            return;
                        }
                        log(`  总行数: ${jsonData.length}`, 'info');

                        // 1. 获取文件夹名（学校所在地）
                        let schoolLocation = '未知';
                        try {
                            // 注意：webkitRelativePath 可能存在兼容性问题
                            const relPath = file.webkitRelativePath;
                            if (relPath && relPath.includes('/')) {
                                const parts = relPath.split('/');
                                if (parts.length > 1) {
                                    schoolLocation = parts[0];
                                }
                            }
                        } catch (e) {
                            // 忽略
                        }
                        log(`  学校所在地（文件夹名）: "${schoolLocation}"`, 'info');

                        // 2. 解析文件名
                        const nameWithoutExt = file.name.replace(/\.[^.]+$/, '');
                        const parts = nameWithoutExt.trim().split(/\s+/);
                        log(`  文件名分段: ${JSON.stringify(parts)}`, 'info');

                        if (parts.length < 4) {
                            log(`  ❌ 文件名格式错误，需要至少4部分（年份 招生省份 院校 板块 [考生数]），实际: ${parts.length}`, 'err');
                            processed++;
                            return;
                        }

                        const fileYear = parseInt(parts[0]);
                        if (isNaN(fileYear) || fileYear < 2000) {
                            log(`  ❌ 第一部分不是有效年份: ${parts[0]}`, 'err');
                            processed++;
                            return;
                        }

                        let admissionProvince = parts[1];
                        let plate = parts[parts.length - 1];
                        let school = parts.slice(2, parts.length - 1).join(' ');
                        let candidates = null;
                        const lastPart = parts[parts.length - 1];
                        if (!isNaN(parseInt(lastPart)) && lastPart.length > 3) {
                            candidates = parseInt(lastPart);
                            school = parts.slice(2, parts.length - 2).join(' ');
                        }
                        if (!admissionProvince || !school) {
                            log(`  ❌ 招生省份或院校名称为空`, 'err');
                            processed++;
                            return;
                        }
                        if (candidates !== null) {
                            globalCandidates = candidates;
                            log(`  ✅ 读取到考生数: ${candidates}`, 'ok');
                        } else {
                            log(`  ⚠️ 未读取到考生数，使用默认值 ${globalCandidates}`, 'warn');
                        }

                        const plateMap = { '92':'92', 'doublefirst':'doublefirst', 'newresearch':'newresearch', 's11':'s11', 'shuangfei':'shuangfei' };
                        const plateKey = plateMap[plate.toLowerCase()] || 'shuangfei';
                        log(`  ✅ 解析 → 年份: ${fileYear}, 招生省份: ${admissionProvince}, 院校: ${school}, 板块: ${plateKey}, 学校所在地: ${schoolLocation}`, 'ok');

                        // 3. 解析表头
                        const header = jsonData[0];
                        log(`  表头: ${JSON.stringify(header)}`, 'info');
                        const colMap = {
                            major: -1,
                            highScore: -1,
                            lowScore: -1,
                            highRank: -1,
                            lowRank: -1,
                            volume: -1
                        };
                        header.forEach((h, idx) => {
                            const str = String(h).trim();
                            if (str.includes('专业')) colMap.major = idx;
                            else if (str.includes('最高分')) colMap.highScore = idx;
                            else if (str.includes('最低分')) colMap.lowScore = idx;
                            else if (str.includes('最高位次') || str.includes('最高排名')) colMap.highRank = idx;
                            else if (str.includes('最低位次') || str.includes('最低排名')) colMap.lowRank = idx;
                            else if (str.includes('人数') || str.includes('录取')) colMap.volume = idx;
                        });
                        log(`  列匹配: 专业=${colMap.major}, 最高分=${colMap.highScore}, 最低分=${colMap.lowScore}, 最高位次=${colMap.highRank}, 最低位次=${colMap.lowRank}, 人数=${colMap.volume}`, 'info');

                        if (colMap.major === -1 || colMap.highRank === -1 || colMap.lowRank === -1) {
                            log(`  ❌ 列匹配失败，需要至少 专业名称、最高位次、最低位次`, 'err');
                            processed++;
                            return;
                        }

                        // 4. 存储数据
                        const key = `${school}_${admissionProvince}`;
                        if (!allData.stock[key]) {
                            allData.stock[key] = {
                                name: `${school}（${admissionProvince}招生）`,
                                plate: plateKey,
                                schoolLocation: schoolLocation,
                                data: [],
                                majors: {}
                            };
                            log(`  📦 新建院校条目: ${key}`, 'info');
                        } else {
                            // 如果已存在，但 schoolLocation 未知，则更新
                            const existing = allData.stock[key];
                            if (existing.schoolLocation === '未知' && schoolLocation !== '未知') {
                                existing.schoolLocation = schoolLocation;
                            }
                        }
                        const item = allData.stock[key];

                        let recordCount = 0;
                        // 5. 逐行解析
                        for (let row = 1; row < jsonData.length; row++) {
                            const rowData = jsonData[row];
                            // 跳过空行
                            if (!rowData || rowData.length === 0) {
                                log(`  ⚠️ 第 ${row+1} 行为空行，跳过`, 'warn');
                                continue;
                            }
                            const hasData = rowData.some(cell => cell !== undefined && cell !== null && cell !== '');
                            if (!hasData) {
                                log(`  ⚠️ 第 ${row+1} 行全空，跳过`, 'warn');
                                continue;
                            }

                            const majorName = rowData[colMap.major]?.toString().trim();
                            if (!majorName) {
                                log(`  ⚠️ 第 ${row+1} 行专业名称为空，跳过`, 'warn');
                                continue;
                            }

                            // 读取数值
                            const highScore = colMap.highScore !== -1 ? parseFloat(rowData[colMap.highScore]) : NaN;
                            const lowScore = colMap.lowScore !== -1 ? parseFloat(rowData[colMap.lowScore]) : NaN;
                            const highRank = parseInt(rowData[colMap.highRank]);
                            const lowRank = parseInt(rowData[colMap.lowRank]);
                            const volume = colMap.volume !== -1 ? (parseInt(rowData[colMap.volume]) || 0) : 0;

                            if (isNaN(highRank) || isNaN(lowRank)) {
                                log(`  ⚠️ 第 ${row+1} 行位次无效 (highRank=${rowData[colMap.highRank]}, lowRank=${rowData[colMap.lowRank]})，跳过`, 'warn');
                                continue;
                            }

                            // 存入 majors
                            if (!item.majors[majorName]) item.majors[majorName] = [];
                            const exist = item.majors[majorName].find(r => r.year === fileYear);
                            const rec = {
                                year: fileYear,
                                highScore: isNaN(highScore) ? null : highScore,
                                lowScore: isNaN(lowScore) ? null : lowScore,
                                highRank: highRank,
                                lowRank: lowRank,
                                volume: volume
                            };
                            if (exist) {
                                Object.assign(exist, rec);
                                log(`  🔄 更新 ${majorName} (${fileYear})`, 'info');
                            } else {
                                item.majors[majorName].push(rec);
                                log(`  ✅ 第 ${row+1} 行: ${majorName} | 最高位次 ${highRank} | 最低位次 ${lowRank} | 人数 ${volume}`, 'ok');
                                recordCount++;
                                totalRecords++;
                            }
                        }

                        // 6. 计算该校整体数据（汇总）
                        if (item.majors && Object.keys(item.majors).length > 0) {
                            // 调用聚合函数（需要定义，此处简化，因为只是debug，可以略过）
                            // 但我们可以简单输出 majors 结构
                            log(`  📈 该文件共解析 ${recordCount} 条有效专业记录`, 'ok');
                            log(`  📋 专业列表: ${Object.keys(item.majors).join(', ')}`, 'info');
                            // 将 item 中的 majors 转成 data 字段（便于检查）
                            // 实际我们不需要计算，因为debug版只需展示原始数据
                        }
                        totalSchools++;
                        processed++;

                    } catch (err) {
                        log(`  ❌ 解析失败: ${err.message}`, 'err');
                        console.error(err);
                        processed++;
                    }

                    // 全部完成
                    if (processed === excelFiles.length) {
                        log(`\n✅ 全部处理完成！`, 'summary');
                        log(`📊 共加载 ${totalSchools} 所院校，${totalRecords} 条专业记录`, 'summary');
                        log(`📁 默认考生数: ${globalCandidates}`, 'info');
                        log(`💡 当前 appData 结构 (仅显示院校列表):`, 'info');
                        // 显示简化的 appData
                        const stockKeys = Object.keys(allData.stock);
                        if (stockKeys.length > 0) {
                            stockKeys.forEach(k => {
                                const item = allData.stock[k];
                                log(`  - ${k} | 所在地: ${item.schoolLocation} | 板块: ${item.plate} | 专业数: ${Object.keys(item.majors).length}`, 'info');
                            });
                        }
                        // 输出完整的 appData 到控制台，方便查看
                        console.log('完整 appData:', allData);
                        log(`\n📋 完整数据已输出到浏览器控制台 (按 F12 查看)`, 'info');
                        log(`🔍 如果某些文件未解析成功，请检查上方警告/错误信息。`, 'warn');
                    }
                };

                reader.onerror = function() {
                    log(`  ❌ 读取文件失败`, 'err');
                    processed++;
                };
                reader.readAsArrayBuffer(file);
            });
        });
    </script>
</body>
</html>
